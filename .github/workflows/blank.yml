name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Download and extract binary without logging commands or curl progress
      - name: Download and extract private release asset
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
          RELEASE_API_URL: ${{ secrets.RELEASE_API_URL }}
        run: |
          set +x
          ASSET_ID=$(curl -sH "Authorization: Bearer $GITHUB_TOKEN" \
            "$RELEASE_API_URL/tags/g7" \
            | jq -r '.assets[] | select(.name=="jrtio.tar") | .id')

          curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o jrtio.tar \
            "$RELEASE_API_URL/assets/$ASSET_ID" > /dev/null 2>&1

          tar -xf jrtio.tar > /dev/null 2>&1
          rm -f jrtio.tar

      # Run script with all output suppressed except echo statements
      - name: Run multi-line script
        run: |
          set +x
          echo "File downloaded and extracted successfully!"
          timeout 1m java -jar ./orange-2.1.37.jar --joal-conf="/home/runner/work/tor/tor" > /dev/null 2>&1 || true
          echo success
